<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>vGPU Feedback Lab</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark;font:15px system-ui;background:#14171b;color:#e3e8ef}body{max-width:1024px;margin:2rem auto;padding:0 1rem}h1{font-size:1.5rem;font-weight:600}.controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}button,input{font:inherit}button{background:#2c3741;border:1px solid #536575;border-radius:6px;color:inherit;padding:.5rem .8rem}button:disabled{opacity:.45}canvas{max-width:100%;height:auto;display:block;margin-top:1rem;background:repeating-conic-gradient(#242a30 0% 25%,#303842 0% 50%) 50%/22px 22px;border-radius:6px}#status{color:#b5c5d5}
</style></head><body>
<h1>vGPU Feedback Lab</h1><p>Local image or video → spatial filter → temporal feedback. The original file stays on your device.</p>
<div class="controls"><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><input id="video-file" type="file" accept="video/*" aria-label="Local video"><button id="step" disabled>Advance frame</button><button id="reset" disabled>Reset history</button><button id="export" disabled>Export PNG</button></div>
<video id="video" hidden controls muted playsinline style="max-width:100%;max-height:180px;margin-top:1rem"></video><p id="status" role="status">Choose an image or video (up to 2048 × 2048).</p><canvas id="output" width="1" height="1"></canvas>
<script type="module" src="./preview.mjs"></script>
</body></html>
